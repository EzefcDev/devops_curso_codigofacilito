name: CI

on:
  push:
    branches: [ "dev" ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
    
      - name: Set environment variables
        run: echo "SQLITE_DB_LOCATION=$GITHUB_WORKSPACE/todos/todo.db" >> $GITHUB_ENV
  
      - name: Create todos directory
        run: mkdir -p $GITHUB_WORKSPACE/todos

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  docker-deploy:
    runs-on: ubuntu-latest
    needs: [tests]

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/todo-list:latest